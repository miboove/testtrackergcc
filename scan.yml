name: Scan GCC

on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures, à l'heure pile (UTC)
  workflow_dispatch: {}    # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: scraper
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Lancer le scan
        working-directory: scraper
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: node scrape.mjs

      - name: Publier data.json
        run: |
          git config user.name "gcc-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Scan automatique $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
