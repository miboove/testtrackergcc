<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCC Deal Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0e11">
<style>
  :root{
    --bg:#0c0e11; --card:#16191d; --card2:#1d2127; --line:#262b32;
    --ink:#f2f4f6; --ink-dim:#9aa3ad; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;background:linear-gradient(var(--bg) 80%,transparent);}
  h1{margin:0 0 2px;font-size:21px;font-weight:700;letter-spacing:-0.01em}
  .sub{color:var(--ink-dim);font-size:13px}
  .sub b{color:var(--ink);font-weight:600}
  .bar{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-dim);
    padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);color:#0c0e11;border-color:var(--ink);font-weight:600}
  main{padding:6px 14px 40px}
  .empty{color:var(--ink-dim);text-align:center;padding:60px 20px}
  .card{background:var(--card);border-radius:14px;margin:10px 0;overflow:hidden;border:1px solid var(--line);
    display:flex;position:relative}
  .stripe{width:5px;flex:0 0 5px}
  .body{flex:1;padding:13px 14px}
  .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .title{font-weight:600;font-size:14.5px}
  .meta{color:var(--ink-dim);font-size:12.5px;margin-top:2px}
  .nums{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:10px;flex-wrap:wrap}
  .price{font-family:var(--mono);font-size:22px;font-weight:600}
  .price .cur{font-size:13px;color:var(--ink-dim);font-weight:400}
  .gainbox{text-align:right}
  .gain{font-family:var(--mono);font-size:17px;font-weight:600}
  .maxp{color:var(--ink-dim);font-size:12px}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-dim)}
  .timer{font-family:var(--mono)}
  .timer.soon{color:#ff8a80}
  a.go{color:inherit;text-decoration:none;display:block}
  .err{color:var(--ink-dim);font-size:13px;margin-top:8px;font-style:italic}
  .sales{margin-top:8px;font-size:12px;color:var(--ink-dim);display:flex;gap:10px;flex-wrap:wrap}
  .conf{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;font-size:10.5px;background:var(--card2)}
  footer.info{color:var(--ink-dim);font-size:12px;text-align:center;padding:10px 20px 30px}
</style>
</head>
<body>
<header>
  <h1>GCC Deal Tracker</h1>
  <div class="sub" id="sub">Chargement…</div>
  <div class="bar" id="filters"></div>
</header>
<main id="list"><div class="empty">Chargement des dernières données…</div></main>
<footer class="info" id="foot"></footer>
<script>
const $=s=>document.querySelector(s);
let ALL=[], minDisc=0;

function hue(disc){ return Math.round(Math.max(0,Math.min(1,(disc||0)/0.4))*120); }
function fmtEnd(ts){
  if(!ts) return null;
  const d=ts-Date.now();
  if(d<=0) return {label:'Terminée', soon:true};
  const h=Math.floor(d/3600000), m=Math.floor(d%3600000/60000);
  const label = h>=24 ? Math.floor(h/24)+' j '+(h%24)+' h' : h+' h '+m+' min';
  return {label, soon:d<3*3600000};
}
function render(){
  const list=$('#list');
  const rows=ALL.filter(x=>x.disc==null || x.disc>=minDisc);
  if(!rows.length){ list.innerHTML='<div class="empty">Aucune enchère ne correspond à ce filtre pour le moment.</div>'; return; }
  list.innerHTML = rows.map(x=>{
    const h = x.disc!=null ? hue(x.disc) : null;
    const stripe = h!=null ? `hsl(${h} 65% 45%)` : '#333';
    const end = fmtEnd(x.endTs);
    const meta = [x.game, x.co?`${x.co} ${x.grade}`:'Non gradé', x.lang].filter(Boolean).join(' · ');
    return `<a class="go" href="${x.href}" target="_blank" rel="noopener">
      <div class="card">
        <div class="stripe" style="background:${stripe}"></div>
        <div class="body">
          <div class="row1"><div class="title">${x.title}</div></div>
          <div class="meta">${meta}</div>
          <div class="nums">
            <div class="price">${x.price}<span class="cur"> €</span></div>
            ${x.val!=null ? `<div class="gainbox">
              <div class="gain" style="color:${stripe}">${x.gain>=0?'+':''}${x.gain} €</div>
              <div class="maxp">max conseillé ${x.maxP} € · ${x.estimate?'annonces Cardmarket':'ventes eBay'} ≈ ${x.val} €</div>
            </div>` : `<div class="err">${x.err||'Pas de données'}</div>`}
          </div>
          ${x.sales&&x.sales.length ? `<div class="sales">${x.sales.map(s=>`${s.d} : ${s.eur} €`).join(' &nbsp;·&nbsp; ')}</div>` : ''}
          <div class="foot">
            <span>${end ? end.label : '—'}${x.n?` <span class="conf">${x.n} ${x.estimate?'annonce':'vente'}${x.n>1?'s':''} · ${x.conf}${x.estimate?' · prix demandés, pas confirmés':''}</span>`:''}</span>
          </div>
        </div>
      </div>
    </a>`;
  }).join('');
  list.querySelectorAll('.timer').forEach(()=>{});
}
function buildFilters(){
  const opts=[[0,'Tout'],[0.1,'≥10%'],[0.2,'≥20%'],[0.3,'≥30%']];
  $('#filters').innerHTML = opts.map(([v,l],i)=>`<div class="chip ${v===minDisc?'on':''}" data-v="${v}">${l}</div>`).join('');
  $('#filters').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{minDisc=+c.dataset.v;buildFilters();render();});
}
async function load(){
  try{
    const r = await fetch('data.json?_=' + Date.now());
    const j = await r.json();
    ALL = j.items || [];
    const good = ALL.filter(x=>x.disc!=null).length;
    $('#sub').innerHTML = `<b>${good}</b> bonnes pistes sur ${ALL.length} enchères · mis à jour ${new Date(j.updated).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;
    buildFilters(); render();
  }catch(e){
    $('#sub').textContent = 'Impossible de charger les données.';
    $('#list').innerHTML = '<div class="empty">Le premier scan n\'a peut-être pas encore tourné — réessayez dans quelques minutes.</div>';
  }
}
setInterval(render, 30000); // rafraîchit les compteurs sans recharger les données
setInterval(load, 5*60000);  // relit data.json toutes les 5 min
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
